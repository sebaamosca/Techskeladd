services:
  db:
    container_name: techskeladd-postgres
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "${PORT_POSTGRES}:5432"
    networks:
      - techskeladd-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  odoo:
    container_name: techskeladd-odoo
    image: odoo:17.0
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT_ODOO}:8069"
    environment:
      - HOST=${POSTGRES_HOST}
      - PORT=${POSTGRES_PORT}
      - USER=${POSTGRES_USER}
      - PASSWORD=${POSTGRES_PASSWORD}
    command: odoo -d ${POSTGRES_DB} -i base --load=base,web
    volumes:
      - ./odoo_data:/var/lib/odoo
    networks:
      - techskeladd-net

  n8n:
    container_name: techskeladd-n8n
    image: n8nio/n8n:latest
    restart: always
    ports:
      - "${PORT_N8N}:5678"
    environment:
      - DB_TYPE=sqlite
    volumes:
      - ./n8n_data:/home/node/.n8n
    networks:
      - techskeladd-net

networks:
  techskeladd-net:
    driver: bridge